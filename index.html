<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EO Treasury Workbench</title>
    <meta
      name="description"
      content="EO Treasury internal workbench for treasury tools and downloadable utilities."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Workbench navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">EO</span>
          <div>
            <h1>EO Treasury</h1>
            <p>Workbench</p>
          </div>
        </div>

        <nav class="nav" aria-label="Tools">
          <button class="nav-item active" type="button" data-view="home">
            <span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-src="./tools/fx-calculator.html">
            <span>FX Calculator</span>
          </button>
          <button class="nav-item" type="button" data-src="./tools/bank-account-modify.html">
            <span>Bank Account Modify</span>
          </button>
          <button class="nav-item" type="button" data-src="./tools/payment-instruction-generator.html">
            <span>Payment Instruction</span>
          </button>
          <button class="nav-item" type="button" data-src="./tools/oo-settlement/index.html">
            <span>OO Settlement</span>
          </button>
          <button class="nav-item" type="button" data-src="./apps/commission/index.html">
            <span>Commission Settlement</span>
          </button>
          <button class="nav-item" type="button" data-view="toolbox">
            <span>Toolbox</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Internal Tools</p>
            <h2 id="view-title">Overview</h2>
          </div>
          <div class="topbar-actions">
            <div class="fx-quick-links" id="fx-quick-links" hidden>
              <a href="https://www.moneychain.com.au/exchange-rates/" target="_blank" rel="noreferrer">
                Rates
              </a>
              <a href="https://www.boc.cn/sourcedb/whpj/" target="_blank" rel="noreferrer">
                Bank Rate
              </a>
              <a href="https://shinyuan-my.sharepoint.com/:x:/r/personal/database_shinyuan_com_au/_layouts/15/Doc.aspx?sourcedoc=%7B946037A2-05E4-4407-921E-9D23BCEDF0DE%7D&file=%5BAmanda%5D%20Transaction%20Summary%20-%20Strictly%20Confidential.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1" target="_blank" rel="noreferrer">
                Transaction
              </a>
              <a href="https://sys.shinyuan.com.au/history/transaction_check_list" target="_blank" rel="noreferrer">
                官网
              </a>
            </div>
          </div>
        </header>

        <section class="home-view" id="home-view">
          <div class="intro">
            <h3>工作台</h3>
          </div>

          <div class="tool-grid" aria-label="Available tools">
            <button class="tool-card" type="button" data-src="./tools/payment-instruction-generator.html">
              <span>Payment Instruction</span>
              <strong>付款指令生成</strong>
              <small>生成付款相关文本和表单内容</small>
            </button>
            <button class="tool-card" type="button" data-src="./tools/fx-calculator.html">
              <span>FX Calculator</span>
              <strong>汇率计算器</strong>
              <small>报价</small>
            </button>
            <button class="tool-card" type="button" data-src="./tools/bank-account-modify.html">
              <span>Bank Account Modify</span>
              <strong>银行账户修改</strong>
              <small>整理账户修改所需信息</small>
            </button>
            <button class="tool-card" type="button" data-src="./apps/commission/index.html">
              <span>Commission Settlement</span>
              <strong>佣金结算</strong>
              <small>现有 React 应用的静态版本</small>
            </button>
            <button class="tool-card" type="button" data-src="./tools/oo-settlement/index.html">
              <span>OO Settlement</span>
              <strong>OO 业务结算</strong>
              <small>生成 USDT 结算复制文案</small>
            </button>
          </div>
        </section>

        <section class="toolbox-view" id="toolbox-view" hidden>
          <div class="intro">
            <h3>工具箱</h3>
            <p>这里放不需要在线运行、需要下载到本机使用的小工具。</p>
          </div>

          <div class="download-card">
            <div>
              <p class="eyebrow">Download</p>
              <h3>Daily Folder Creator</h3>
              <p>
                包含 `daily_create_folder.py`、`template.txt` 和相关模板文件。
                下载后解压，在本机目录里运行即可生成文件夹和空 Word 文档。
              </p>
            </div>
            <a class="download-button" href="./downloads/daily-folder-creator.zip" download>
              Download ZIP
            </a>
          </div>

        </section>

        <section class="frame-view" id="frame-view" hidden>
          <iframe id="tool-frame" title="Selected EO Treasury tool"></iframe>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
